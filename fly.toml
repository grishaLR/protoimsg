# fly.toml app configuration file generated for protoimsg
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'protoimsg'
primary_region = 'iad'

[build]
  dockerfile = 'packages/server/Dockerfile'

[deploy]
  release_command = 'node dist/db/migrate.js'

[env]
  HOST = '0.0.0.0'
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    port = 3000
    type = 'http'
    interval = '15s'
    timeout = '5s'
    path = '/health'

[metrics]
  port = 3000
  path = "/metrics"

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
