app = 'protoimsg-pds'
primary_region = 'iad'

[build]
  # Custom fork of bluesky-social/pds — adds SMTP via Resend + email template tweaks.
  # See https://github.com/grishalr/pds for changes vs upstream.
  image = 'ghcr.io/grishalr/pds:latest'

[deploy]
  strategy = 'rolling'

[env]
  PDS_HOSTNAME = 'pds.protoimsg.app'
  PDS_SERVICE_HANDLE_DOMAINS = '.protoimsg.app'
  PDS_DID_PLC_URL = 'https://plc.directory'
  PDS_BSKY_APP_VIEW_URL = 'https://api.bsky.app'
  PDS_BSKY_APP_VIEW_DID = 'did:web:api.bsky.app'
  PDS_REPORT_SERVICE_URL = 'https://mod.bsky.app'
  PDS_REPORT_SERVICE_DID = 'did:plc:ar7c4by46qjdydhdevvrndac'
  PDS_CRAWLERS = 'https://bsky.network'
  PDS_DATA_DIRECTORY = '/pds'
  PDS_BLOBSTORE_DISK_LOCATION = '/pds/blocks'
  PDS_PORT = '3000'
  PDS_INVITE_REQUIRED = 'false'
  PDS_SQLITE_DISABLE_WAL_AUTO_CHECKPOINT = '1'
  LOG_LEVEL = 'debug'
  LOG_ENABLED = 'true'
  PDS_SERVICE_NAME = 'proto instant messenger'                                                                       
  PDS_LOGO_URL = 'https://protoimsg.app/logo.png'                                                                    
  PDS_PRIMARY_COLOR = '#8b5cf6'                                                                                      
  PDS_DARK_COLOR = '#1a1a2e'                                
  PDS_HOME_URL = 'https://protoimsg.app'
  PDS_TERMS_OF_SERVICE_URL = 'https://protoimsg.app/tos'
  PDS_PRIVACY_POLICY_URL = 'https://protoimsg.app/privacy'
  PDS_SUPPORT_URL = 'https://protoimsg.app/support'

[mounts]
  source = 'pds_data'
  destination = '/pds'

[metrics]
  port = 3000
  path = '/metrics'

[[services]]
  internal_port = 3000
  protocol = 'tcp'
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.http_checks]]
    interval = 15000
    timeout = 5000
    grace_period = '5m'
    method = 'GET'
    path = '/xrpc/_health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
